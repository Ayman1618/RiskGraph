global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "riskgraph-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "riskgraph-local"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"
