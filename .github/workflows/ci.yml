name: RiskGraph CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskgraph_user
          POSTGRES_PASSWORD: riskgraph_secure_pass
          POSTGRES_DB: riskgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Linters & Formatting Check
        run: |
          black --check src/ tests/ dags/ cli.py
          isort --check-only src/ tests/ dags/ cli.py
          flake8 src/ tests/ dags/ cli.py --max-line-length=120 --ignore=E203,W503 || true

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing tests/

      - name: Verify CLI Functionality
        run: |
          python cli.py status
          python cli.py generate-stream --rate 0 --count 20
          python cli.py evaluate-tx --amount 100
          python cli.py run-dq-suite --sample-size 50
